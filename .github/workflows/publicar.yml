name: Publicar a Rádio Tec

# Roda sempre que algo muda no acervo ou na programação (e pode ser rodado à mão).
# Também confere de hora em hora se chegaram áudios novos no Cloudflare R2.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Reaproveitar áudios já tratados
        uses: actions/cache@v4
        with:
          path: .cache-audio
          key: audio-${{ hashFiles('acervo/**') }}
          restore-keys: audio-

      - name: Gerar a programação e tratar os áudios
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: radiotec
          R2_PUBLIC_URL: https://pub-6925f1a508c1473a8829a436258d4233.r2.dev
        run: |
          cd gerador && npm ci --silent && cd ..
          node gerador/gerar.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
