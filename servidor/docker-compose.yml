# Rádio Tec: sobe tudo com `docker compose up -d` num VPS Linux.
services:
  app:
    build: ./app
    restart: always
    env_file: .env
    environment:
      DATA_DIR: /data
      LIQ_DATA_DIR: /data
      ICECAST_STATUS_URL: http://icecast:8000/status-json.xsl
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/data

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    restart: always
    depends_on: [app, icecast]
    env_file: .env
    environment:
      API_URL: http://app:3000
      ICECAST_HOST: icecast
      TZ: America/Sao_Paulo
    entrypoint: ["liquidsoap"]
    command: ["/radio/radio.liq"]
    volumes:
      - ./liquidsoap:/radio:ro
      - ./data:/data:ro
    ports:
      - "8005:8005"   # entrada do ao vivo (BUTT/Mixxx), protegida por senha

  icecast:
    build: ./icecast
    restart: always
    env_file: .env

  caddy:
    image: caddy:2
    restart: always
    depends_on: [app, icecast]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
